# Managed by codex-sci-loop
allow_managed_hooks_only = false

[features]
hooks = true

[hooks]
managed_dir = "/opt/codex-loop-harness/plugins/codex-loop-harness/scripts"

[[hooks.SessionStart]]
matcher = "startup|resume"

[[hooks.SessionStart.hooks]]
type = "command"
command = "/usr/bin/python3 /opt/codex-loop-harness/plugins/codex-loop-harness/scripts/check-codex-hook-after-update.py --hook-mode"
timeout = 60

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "/usr/bin/python3 /opt/codex-loop-harness/plugins/codex-loop-harness/scripts/goal-loop-bootstrap.py"
timeout = 120
statusMessage = "Preparing loop for goal work"
