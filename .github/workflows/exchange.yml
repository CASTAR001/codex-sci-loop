name: Workspace exchange
on:
  push:
    branches: [codex/cross-session-exchange]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mailbox:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -B tests/test_sci_loop_exchange.py
      - run: python -B tests/test_sci_loop_checkpoint.py
      - run: python -B tests/test_sci_loop_distribution.py
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install -g --no-audit --no-fund "@openai/codex@0.167.1"
      - run: python -B tests/test_sci_loop_distribution.py --codex-install
      - if: runner.os != 'Windows'
        run: python -B tests/test_native_exchange.py
