name: Native Codex checkpoints
on:
  pull_request:
    paths:
      - 'plugins/codex-sci-loop/**'
      - '.agents/plugins/marketplace.json'
      - 'tests/test_sci_loop_*.py'
      - 'tests/measure_turn_usage.py'
      - 'tests/test_measure_turn_usage.py'
      - 'tests/probe_skill_routing.py'
      - 'install.sh'
      - '.github/workflows/native.yml'
  workflow_dispatch:
    inputs:
      codex_version:
        description: Codex CLI release to check
        default: '0.172.0'
        required: true

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      CODEX_TEST_VERSION: ${{ inputs.codex_version || '0.172.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/sci-loop-cli" "@openai/codex@$CODEX_TEST_VERSION"
      - run: echo "$RUNNER_TEMP/sci-loop-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - run: python3 -B tests/test_sci_loop_checkpoint.py
      - run: python3 -B tests/test_measure_turn_usage.py
      - run: python3 -B tests/test_sci_loop_distribution.py --codex-install
      - run: python3 -B tests/test_sci_loop_native_codex.py
      - run: python3 -B tests/probe_skill_routing.py --suite daily-long
      - run: python3 -B tests/probe_skill_routing.py --suite daily-long --without-plugin
